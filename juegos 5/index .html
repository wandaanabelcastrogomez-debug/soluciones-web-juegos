<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minijuegos de lógica — un concepto nuevo cada semana</title>
<style>
  :root { --fondo:#0f1220; --panel:#181c2f; --texto:#e8ecff; --suave:#a2aacb; --acento:#7c9cff; --borde:#2c3252; }
  * { box-sizing:border-box; }
  body { margin:0; padding:26px 14px 56px; background:radial-gradient(1000px 500px at 50% -10%, #1b2140 0%, var(--fondo) 55%);
         color:var(--texto); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.55; }
  .envoltura { max-width:820px; margin:0 auto; }
  .etiqueta { display:inline-block; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--acento);
              background:rgba(124,156,255,.12); border:1px solid rgba(124,156,255,.35); padding:4px 10px; border-radius:999px; margin-bottom:10px; }
  h1 { font-size:clamp(1.4rem,4.4vw,2rem); margin:0 0 8px; line-height:1.2; }
  .intro { color:var(--suave); margin:0 0 22px; max-width:60ch; }
  .lista { display:grid; gap:12px; grid-template-columns:1fr; }
  @media (min-width:640px) { .lista { grid-template-columns:1fr 1fr; } }
  .tarjeta { display:block; text-decoration:none; color:inherit; background:var(--panel); border:1px solid var(--borde);
             border-radius:14px; padding:16px; transition:transform .12s ease, border-color .12s ease; }
  .tarjeta:hover { border-color:var(--acento); transform:translateY(-2px); }
  .tarjeta .semana { font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--acento); }
  .tarjeta h2 { font-size:1.05rem; margin:6px 0 4px; }
  .tarjeta .concepto { margin:0; font-size:.9rem; color:var(--suave); }
  .tarjeta .concepto strong { color:var(--texto); }
  .tarjeta .fecha { margin:2px 0 10px; font-size:.78rem; color:var(--suave); min-height:1em; }
  .tarjeta .jugar { font-size:.9rem; font-weight:700; color:var(--acento); }
  .vacio { background:var(--panel); border:1px dashed var(--borde); border-radius:14px; padding:20px; color:var(--suave); }
  .pie { color:var(--suave); font-size:.8rem; margin-top:26px; text-align:center; }
</style>
</head>
<body>
<div class="envoltura">
  <span class="etiqueta">Lógica de programación desde cero</span>
  <h1>Minijuegos de lógica</h1>
  <p class="intro">Cada semana se publica un minijuego nuevo para practicar un concepto de lógica de programación. Aquí están todos, también los de semanas anteriores.</p>
  <div class="lista" id="lista"><div class="vacio">Cargando minijuegos…</div></div>
  <p class="pie" id="pie"></p>
  <noscript><p class="vacio">Activa JavaScript para ver la lista. Mientras tanto, cada juego está en <code>semana-01.html</code>, <code>semana-02.html</code>, etc.</p></noscript>
</div>

<script>
(function () {
  "use strict";
  var lista = document.getElementById("lista");
  var pie = document.getElementById("pie");

  function esc(t) {
    return String(t === undefined || t === null ? "" : t)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function pintar(juegos) {
    juegos.sort(function (a, b) { return b.semana - a.semana; });
    lista.innerHTML = juegos.map(function (j) {
      return '<a class="tarjeta" href="' + esc(j.archivo) + '">' +
        '<span class="semana">Semana ' + esc(j.semana) + '</span>' +
        '<h2>' + esc(j.titulo) + '</h2>' +
        '<p class="concepto">Concepto: <strong>' + esc(j.concepto) + '</strong></p>' +
        '<p class="fecha">' + esc(j.fecha || "") + '</p>' +
        '<span class="jugar">Jugar &rarr;</span>' +
        '</a>';
    }).join("");
    var ultimo = juegos[0];
    pie.textContent = juegos.length + (juegos.length === 1 ? " minijuego publicado" : " minijuegos publicados") +
      (ultimo ? " · último: semana " + ultimo.semana + " (" + ultimo.concepto + ")" : "");
  }

  fetch("historial.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (datos) {
      var juegos = (datos && datos.juegos) || [];
      if (!juegos.length) {
        lista.innerHTML = '<div class="vacio">Todavía no hay minijuegos publicados. Vuelve la próxima semana.</div>';
        return;
      }
      pintar(juegos);
    })
    .catch(function () {
      lista.innerHTML = '<div class="vacio">No se pudo cargar la lista de minijuegos en este momento. ' +
        'Recarga la página; si sigue igual, abre el juego que buscas directamente con su dirección: ' +
        'semana-01.html, semana-02.html, semana-03.html…</div>';
    });
})();
</script>
</body>
</html>
